services:
    db:
        container_name: repwise-db # postgres
        image: postgres:15.2
        restart: always
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        ports:
            - 5433:5432
        volumes:
            - postgres_data:/var/lib/postgresql/data
        networks:
            - repwise-network # backend

    redis:
        container_name: repwise-redis # redis
        image: redis:7.4.1
        restart: always
        ports:
            - 6379:6379
        command: redis-server --requirepass ${REDIS_PASSWORD}
        volumes:
            - redis_data:/data
        networks:
            - repwise-network # backend

volumes:
    postgres_data:
    redis_data:

networks:
    repwise-network:
